<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VOD Player Controller</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
<style data-purpose="custom-utilities">
    .text-shadow-md {
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .gradient-overlay-top {
      background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
    }
    .gradient-overlay-bottom {
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
    }
    /* Custom Slider Styling */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      margin-top: -6px; /* You need to specify a margin in Chrome, but in Firefox and IE it is automatic */
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
    }
    
    /* Progress bar specific */
    .progress-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
      position: relative;
      cursor: pointer;
    }
    .progress-fill {
      height: 100%;
      background-color: #00A8E1;
      border-radius: 3px;
      width: 50%; /* Adjust based on current time */
      position: relative;
    }
    .progress-thumb {
      width: 14px;
      height: 14px;
      background-color: #00A8E1;
      border-radius: 50%;
      position: absolute;
      right: -7px;
      top: 50%;
      transform: translateY(-50%);
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden font-sans select-none flex items-center justify-center">
<!-- Main Player Container -->
<div class="relative w-full h-full max-w-[1376px] max-h-[768px] bg-gray-900 group">
<!-- Video Background Placeholder (Image) -->
<img alt="Video Background" class="absolute inset-0 w-full h-full object-cover opacity-80 pointer-events-none" src="https://lh3.googleusercontent.com/aida/ADBb0ugL2Oks2qKFHkCf3VFT3UmD68bftKypDeh9BBPs1iugAbdPV5Ii81a2nUElNLDBjLMu1gzHo4gFz2oBvk7wZrQ9kmC302vv2PKNsLJIy7InkF_Jsn3s1UOsm173s1n21CsaftXuxXqbjmOHhDIO37b_WbBgWx_rU9rdlGBGJ03tPDIvK89MMf0E7Nm3VHVlujNSVVCQ_q4oI9y3ztX9YCEfnwTgM_5pO0qX5SgqkCIdkFILXR5bodfhsMQ"/>
<!-- UI Overlay (Fades in/out on hover) -->
<div class="absolute inset-0 flex flex-col justify-between opacity-100 transition-opacity duration-300">
<!-- BEGIN: Top Bar -->
<div class="gradient-overlay-top p-6 flex justify-between items-center z-10">
<!-- Title -->
<h1 class="text-3xl font-semibold text-shadow-md tracking-wide">Interstellar</h1>
<!-- Top Right Controls -->
<div class="flex items-center space-x-6">
<!-- X-Ray Toggle -->
<div class="flex items-center space-x-3">
<span class="text-lg font-medium text-gray-200">X-Ray</span>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-500/50 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-gray-400/80"></div>
</label>
</div>
<!-- Quality Icon -->
<button class="text-gray-300 hover:text-white transition-colors p-2">
<i class="fa-solid fa-tv text-xl"></i>
</button>
<!-- Subtitles Icon -->
<button class="text-gray-300 hover:text-white transition-colors p-2">
<i class="fa-regular fa-comment-dots text-2xl"></i>
</button>
</div>
</div>
<!-- END: Top Bar -->
<!-- BEGIN: Bottom Bar -->
<div class="gradient-overlay-bottom px-8 pb-8 pt-16 flex flex-col z-10 space-y-6">
<!-- Progress Bar Area -->
<div class="relative w-full group/progress">
<!-- Tooltip (Visible on hover over progress area) -->
<div class="absolute -top-10 left-[50%] transform -translate-x-1/2 bg-gray-200 text-gray-900 text-sm font-semibold py-1 px-3 rounded shadow-lg pointer-events-none">
            01:24:30 / 02:49:00
            <!-- Tooltip Arrow -->
<div class="absolute top-full left-1/2 transform -translate-x-1/2 border-solid border-t-gray-200 border-t-[6px] border-x-transparent border-x-[6px] border-b-0"></div>
</div>
<!-- The Track -->
<div class="progress-track">
<!-- Buffered (Example) -->
<div class="absolute h-full bg-gray-500/50 rounded-3px" style="width: 65%;"></div>
<!-- Played -->
<div class="progress-fill">
<div class="progress-thumb"></div>
</div>
</div>
</div>
<!-- Controls Row -->
<div class="flex justify-between items-center px-4">
<!-- Left side (Empty for centering) -->
<div class="w-1/3"></div>
<!-- Center Controls (Play/Pause/Skip) -->
<div class="flex items-center justify-center space-x-6 w-1/3">
<button class="text-gray-300 hover:text-white transition-colors p-2 rounded-full focus:outline-none focus:ring-2 focus:ring-white/50">
<i class="fa-solid fa-rotate-left text-2xl"></i>
<span class="sr-only">Rewind 10 seconds</span>
</button>
<button class="text-white bg-white/10 hover:bg-white/20 border border-white/30 rounded-full w-14 h-14 flex items-center justify-center transition-all focus:outline-none focus:ring-2 focus:ring-white" id="playPauseBtn">
<i class="fa-solid fa-pause text-2xl" id="playIcon"></i>
</button>
<button class="text-gray-300 hover:text-white transition-colors p-2 rounded-full focus:outline-none focus:ring-2 focus:ring-white/50">
<i class="fa-solid fa-rotate-right text-2xl"></i>
<span class="sr-only">Fast forward 10 seconds</span>
</button>
</div>
<!-- Right Controls (Volume & Next) -->
<div class="flex items-center justify-end space-x-6 w-1/3">
<!-- Volume Control -->
<div class="flex items-center space-x-3 group/volume">
<button class="text-gray-300 hover:text-white transition-colors focus:outline-none">
<i class="fa-solid fa-volume-high text-xl w-6 text-center"></i>
</button>
<div class="w-24 opacity-0 group-hover/volume:opacity-100 transition-opacity duration-300 flex items-center">
<input class="w-full h-1" max="100" min="0" type="range" value="80"/>
</div>
</div>
<!-- Next Episode Button -->
<button class="bg-gray-700/60 hover:bg-gray-600/80 border border-gray-500/50 text-white text-sm font-medium py-2 px-4 rounded transition-colors focus:outline-none focus:ring-2 focus:ring-white/50">
              Next Episode
            </button>
</div>
</div>
</div>
<!-- END: Bottom Bar -->
</div>
</div>
<script data-purpose="player-interactions">
    document.addEventListener('DOMContentLoaded', () => {
      const playPauseBtn = document.getElementById('playPauseBtn');
      const playIcon = document.getElementById('playIcon');
      let isPlaying = true;

      playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
          playIcon.classList.remove('fa-play');
          playIcon.classList.add('fa-pause');
        } else {
          playIcon.classList.remove('fa-pause');
          playIcon.classList.add('fa-play');
          // Add a slight padding adjust for the play icon to look centered
          playIcon.classList.add('ml-1');
        }
      });
    });
  </script>
</body></html>
