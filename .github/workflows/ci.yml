# The quality gate, off this machine (roadmap E9 was "pre-commit + gradlew check" - both local;
# a hook can be bypassed with --no-verify and a laptop can be lost). Every push and pull request
# to main now runs the same four checks the pre-commit hook and `gradlew check` run here:
#
#   1. repo hygiene         scripts/check_repo_hygiene.sh   (no stray/zero-byte/scratch files)
#   2. unit tests           :app:testDebugUnitTest          (867 at the time of writing)
#   3. detekt + the ratchet :app:detekt debtRatchet          (config/detekt/debt-ledger.txt ceilings)
#   4. the debug APK builds :app:assembleDebug
#   5. the RELEASE APK builds :app:assembleRelease           (R8 full mode + resource shrinking)
#
# Why step 5 exists (audit 2026-09-08, finding F2). Steps 1-4 never compiled the variant that
# actually ships. The release build is the only one that runs R8 in full mode with resource
# shrinking, and R8 is where this project's worst failure class lives: an orphaned @HiltViewModel
# compiles, unit-tests green, and then crash-loops on the television because the keep rules no
# longer reach it. assembleRelease closes that gap with no secret of any kind - see below.
#
# Signing: keystore.properties is git-ignored, so on CI `signingConfigs.release` stays empty and
# the release build type never sets one. AGP then packages the release APK UNSIGNED, which is
# exactly right here: the point of step 5 is that R8, the keep rules and packaging all run, not
# that CI produces an installable artifact. The signed APK is still built only on the owner's
# machine, where keystore.properties exists.
#
# What CI still deliberately does NOT do: sign anything, run instrumented tests (Fire TV only),
# or talk to Firebase (see the google-services stub below).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Repo hygiene
        run: bash scripts/check_repo_hygiene.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The google-services plugin refuses to configure without a config file, and the real one
      # is git-ignored (it carries the project's API key). The stub has the right package name
      # and valid placeholders - enough to generate resources, useless for reaching Firebase.
      - name: Firebase config stub
        run: cp config/ci/google-services.json app/google-services.json

      - name: Unit tests, detekt, debt ratchet, debug APK, release APK
        run: ./gradlew :app:testDebugUnitTest :app:detekt debtRatchet :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 14
