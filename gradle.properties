# Project-wide Gradle settings.
# Optimized for Windows environment and Android TV development

# JVM Settings - Increased memory for complex builds with Windows optimizations
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:+UseStringDeduplication -Dfile.encoding=UTF-8

# Build Performance Optimizations
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.vfs.watch=true

# Android-specific optimizations
android.useAndroidX=true
android.enableJetifier=true
android.enableR8.fullMode=true

# Kotlin optimizations
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.android=true
kotlin.incremental.java=true
kotlin.caching.enabled=true
kotlin.build.report.output=file

# Memory optimizations for large projects
org.gradle.workers.max=4
org.gradle.logging.level=info
