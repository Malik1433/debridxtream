# Project-wide Gradle settings.
# Optimized for Windows environment and Android TV development

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+UseStringDeduplication -Dfile.encoding=UTF-8

# Build Performance Optimizations
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.caching=false
org.gradle.daemon=false
org.gradle.vfs.watch=false

# Android-specific optimizations
android.useAndroidX=true
android.enableJetifier=true
android.enableR8.fullMode=true

# Kotlin optimizations
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.android=true
kotlin.incremental.java=true
kotlin.caching.enabled=true
kotlin.build.report.output=file

# Memory optimizations for large projects
org.gradle.workers.max=2
org.gradle.logging.level=info
