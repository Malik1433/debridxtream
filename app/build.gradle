plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'io.gitlab.arturbosch.detekt' version '1.23.7'
}

// Structural guardrail (god-class prevention). Same philosophy as the lint baseline below:
// every oversized class that exists TODAY is grandfathered into detekt-baseline.xml, but any NEW
// violation fails `./gradlew detekt`. Thresholds are the industry defaults (detekt/Clean Code):
// class 600 lines, method 60, cyclomatic complexity 15, params 6/7 — see config/detekt/detekt.yml.
// Regenerate the baseline deliberately (only after real refactoring) with: ./gradlew detektBaseline
// E2p: the ratchet runs as part of `check`, so "regenerate the baseline and move on" fails the
// build instead of passing quietly. Definition + rationale live in the root build.gradle.
tasks.matching { it.name == 'check' }.configureEach {
    dependsOn rootProject.tasks.named('debtRatchet')
}

detekt {
    toolVersion = '1.23.7'
    source.setFrom(files('src/main/java', 'src/test/java'))
    config.setFrom(files(rootProject.file('config/detekt/detekt.yml')))
    buildUponDefaultConfig = true
    baseline = rootProject.file('config/detekt/detekt-baseline.xml')
    parallel = true
    ignoreFailures = false
}

// Release signing + anti-repack config, kept OUT of git (keystore.properties is
// .gitignored). Absent on dev/CI → every lookup returns "", so signing falls back to
// debug and the signature self-check is a no-op. See keystore.properties.example.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystoreProps.load(keystorePropsFile.newDataInputStream())
}

android {
    namespace 'com.tvonnet.debridxtreamiptv'
    compileSdk 35  // Updated to latest API level for better TV support

    defaultConfig {
        // Align with the installed TV app package on device so `adb install -r` updates the same app.
        applicationId "com.debridxtream.tv"
        // Raised 21 -> 23 (owner's decision, 2026-07-31) so firebase-auth can come from the BOM
        // instead of being pinned to an unsupported older line. Cost: Fire OS 5 hardware (Android
        // 5.x, API 21-22) can no longer install or UPDATE this app — an existing install on such a
        // device keeps running the build it already has.
        minSdk 23
        targetSdk 35  // Updated to match compileSdk for latest Android features
        // Bumped for the account release (§7-§9). This is also what makes the fleet
        // ANSWERABLE: LicenseManager writes appVersionCode to licenses/{installId} on every
        // launch, so anything still reporting 36 has not taken the account build — which is
        // exactly the question U8b hangs on.
        versionCode 64
        versionName "2.4.7"
        multiDexEnabled true
        multiDexKeepFile file('multidex-keep.txt')
        multiDexKeepProguard file('multidex-keep.pro')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        Properties properties = new Properties()
        if (project.rootProject.file('local.properties').exists()) {
            properties.load(project.rootProject.file('local.properties').newDataInputStream())
        }
        def tmdbKey = properties.getProperty("TMDB_API_KEY") ?: ""
        buildConfigField "String", "TMDB_API_KEY", "\"${tmdbKey}\""
        // Phase 5: OMDb key out of source, same pattern as TMDB. Put OMDB_API_KEY in
        // local.properties (mirrors TMDB_API_KEY) or IMDb/RT ratings return empty.
        def omdbKey = properties.getProperty("OMDB_API_KEY") ?: ""
        buildConfigField "String", "OMDB_API_KEY", "\"${omdbKey}\""

        // Anti-repack signature self-check. Owner puts the RELEASE signing cert's
        // SHA-256 (uppercase hex, no colons) in keystore.properties; the app then
        // refuses premium if it's running under a different (re-signed / repacked)
        // certificate. Empty by default → the check is a NO-OP (debug/dev unaffected),
        // so this is safe to ship before release signing is set up. See AppIntegrity.
        def expectedSig = keystoreProps.getProperty("EXPECTED_SIGNING_SHA256", "")
        buildConfigField "String", "EXPECTED_SIGNING_SHA256", "\"${expectedSig}\""
    }

    // Release signing (SCAFFOLD, inert until keystore.properties exists). Create it from
    // keystore.properties.example with a private release key you generate + BACK UP
    // (lose it → the app can never ship an in-place update again). Switching an already
    // installed debug-signed build to release signing needs a one-time uninstall+reinstall.
    signingConfigs {
        release {
            if (keystoreProps.containsKey('storeFile')) {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use the release key only when configured; otherwise Gradle falls back to
            // the default (debug) signing so dev/CI builds keep working.
            if (keystoreProps.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true  // Week 7: Enable BuildConfig generation
        compose true
    }
    
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }
    
    lint {
        // Release lint re-enabled with a baseline: every issue that exists TODAY is grandfathered
        // into lint-baseline.xml (so we don't have to fix 300+ pre-existing findings at once), but
        // any NEW error fails the build. Regenerate by deleting lint-baseline.xml + running lintRelease.
        abortOnError true
        checkReleaseBuilds true
        baseline = file("lint-baseline.xml")
        warningsAsErrors false
    }

    // Phase 8: expose the exported Room schema JSONs to MigrationTestHelper as androidTest assets.
    sourceSets {
        getByName("androidTest").assets.srcDir("$projectDir/schemas")
    }

    
    // Performance optimizations
    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

}

// Phase 8: tell the Room annotation processor where to write the exported schema JSONs.
kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

dependencies {
    // AndroidX Core - Updated to latest stable versions
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    // ViewModel & Lifecycle (MVVM Architecture) - Updated to latest stable
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    
    // Paging 3 (Week 5: Performance Optimization) - Updated to latest
    implementation 'androidx.paging:paging-runtime-ktx:3.3.2'

    // Room Database (Week 6: Room Database Integration) - Updated to latest stable
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-paging:2.6.1' // Required for PagingSource in DAOs
    
    // Retrofit & Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0' // Week 14: For XML/String responses
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Media3 (ExoPlayer replacement) - Updated to latest stable for TV performance
    implementation 'androidx.media3:media3-exoplayer:1.5.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.0'
    implementation 'androidx.media3:media3-ui:1.5.0'
    implementation 'androidx.media3:media3-common:1.5.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.5.0' // Phase 0: Connection Pooling
    implementation 'androidx.media3:media3-extractor:1.5.0' // Phase 5: V2 TS Tuning
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1'

    // QR Code for Support Dialog
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'

    // Glide for image loading - Updated to latest stable
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    // Coroutines - Updated to latest stable
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Hilt Dependency Injection - Updated to latest
    implementation 'com.google.dagger:hilt-android:2.51.1'
    kapt 'com.google.dagger:hilt-compiler:2.51.1'
    
    // WorkManager (Week 13: Background EPG Sync) - Updated to latest stable
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.hilt:hilt-work:1.2.0'
    kapt 'androidx.hilt:hilt-compiler:1.2.0'

    // Preferences (Week 14: Settings Screen) - Updated to latest
    implementation 'androidx.preference:preference-ktx:1.2.1'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'io.mockk:mockk:1.13.8'
    testImplementation 'app.cash.turbine:turbine:1.0.0'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:1.9.0'
    testImplementation 'androidx.work:work-testing:2.9.1'
    
    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.02.01')
    implementation composeBom
    androidTestImplementation composeBom
    
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    
    // Compose Integration
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    
    // UI Components
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // Image Loading
    implementation 'io.coil-kt:coil-compose:2.6.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    // Phase 8: Room MigrationTestHelper for on-device/emulator schema-migration tests.
    androidTestImplementation 'androidx.room:room-testing:2.6.1'

    // Firebase (Magic Link System)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    // §7 U3: anonymous sign-in, so Firestore rules can express OWNERSHIP instead of
    // "whoever knows the id may read it" (see DeviceIdentity). Version comes from the BOM —
    // that is why minSdk is 23 (see above).
    implementation 'com.google.firebase:firebase-auth-ktx'
    // LP-D-1: remote crash reporting (works without Play services on Fire OS)
    implementation 'com.google.firebase:firebase-crashlytics-ktx'

    // Ktor Server (Companion Config Server)
    def ktor_version = '2.3.7'
    implementation "io.ktor:ktor-server-core:$ktor_version"
    implementation "io.ktor:ktor-server-cio:$ktor_version"
    implementation "io.ktor:ktor-server-content-negotiation:$ktor_version"
    implementation "io.ktor:ktor-serialization-gson:$ktor_version"
    implementation "io.ktor:ktor-server-cors:$ktor_version"
    implementation "io.ktor:ktor-server-status-pages:$ktor_version"
    implementation "io.ktor:ktor-server-host-common:$ktor_version"
}
