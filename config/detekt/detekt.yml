# detekt — structural guardrail config
#
# Purpose: stop NEW god-classes. This is deliberately NOT a full style linter — every
# formatting/naming/style ruleset is off so the signal stays 100% actionable. What is left is the
# size + complexity family, at the industry-standard thresholds:
#
#   LargeClass 600        detekt default; Clean Code says ~200 typical / 500 max
#   LongMethod 60         detekt default (Clean Code is stricter at ~20)
#   CyclomaticComplexMethod 15   McCabe / detekt default
#   LongParameterList 6 fn / 7 ctor
#   NestedBlockDepth 4
#
# Existing violations are grandfathered in config/detekt/detekt-baseline.xml, so this only ever
# fires on NEW code. Run: ./gradlew detekt

build:
  maxIssues: 0

complexity:
  active: true
  LargeClass:
    active: true
    threshold: 600
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotatedParameter: []
    # Owner decision 2026-08-02: DI-injected constructors / @Provides factories are the
    # framework handing a class its collaborators — a long list there is not a design smell,
    # and "fixing" it by bundling injected deps would be fake cohesion.
    ignoreAnnotated:
      - 'Inject'
      - 'Provides'
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    # Deliberately looser than detekt's default of 11: Android Activities/Fragments and the
    # facade classes we built legitimately expose many small delegating members. The real
    # god-class signal we care about is LargeClass/LongMethod above.
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 30
    thresholdInInterfaces: 30
    thresholdInObjects: 30
    thresholdInEnums: 30
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreOverridden: true
  ComplexCondition:
    active: true
    threshold: 4
  LabeledExpression:
    active: false
  StringLiteralDuplication:
    active: false
  ComplexInterface:
    active: false
  MethodOverloading:
    active: false
  ReplaceSafeCallChainWithRun:
    active: false

# ── Runtime-correctness rules ────────────────────────────────────────────────────────────────────
# Chosen by MEASURING each candidate against this codebase first, not by copying a template. Every
# rule below is either (a) zero findings today = a free guard that keeps it at zero, or (b) tied to a
# bug class this app actually shipped. Rules that fired a lot but carry no runtime benefit here were
# deliberately REJECTED and are listed at the bottom with the reason.

coroutines:
  active: true
  GlobalCoroutineUsage:      # 0 today. Detached scopes leaked before (EPG parse outlived its caller).
    active: true
  SleepInsteadOfDelay:       # 0 today. Thread.sleep in a coroutine blocks a pooled thread.
    active: true
  RedundantSuspendModifier:  # 0 today.
    active: true
  SuspendFunWithFlowReturnType:  # 0 today.
    active: true
  InjectDispatcher:
    active: false            # needs type resolution to be meaningful; would be a false-zero here.

exceptions:
  active: true
  SwallowedException:        # 47 baselined. This is the class that broke cooperative cancellation
    active: true             # (CancellationException caught and turned into Result.Error).
  ReturnFromFinally:
    active: true
  RethrowCaughtException:
    active: true
  PrintStackTrace:           # 2 baselined — should be Log.e so it reaches Crashlytics.
    active: true
  TooGenericExceptionCaught:
    active: false            # REJECTED: 252 hits. catch(Exception) is deliberate resilience in the
                             # playback/network paths here; forcing specific types is churn, not safety.

potential-bugs:
  active: true
  ExplicitGarbageCollectionCall:  # 1 baselined. System.gc() causes frame drops — an audit finding.
    active: true                  # NOTE: MemoryManager's call is deliberate under heap pressure;
                                  # baselined on purpose, do not blind-remove it.
  ImplicitDefaultLocale:     # 31 baselined. Real bug class for this app's DE/HI users:
    active: true             # "%.1f".format(x) yields "1,5" in a comma-decimal locale.
  DontDowncastCollectionTypes:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  LateinitUsage:
    active: false            # REJECTED: 299 hits. lateinit is idiomatic Android (views, injected deps).

performance:
  active: true
  SpreadOperator:            # 2 baselined.
    active: true
  UnnecessaryTemporaryInstantiation:
    active: true
  ArrayPrimitive:
    active: true

# Off on purpose — style police, not correctness. Each would need its own baseline pass.
comments:
  active: false
style:
  active: false
naming:
  active: false
empty-blocks:
  active: false
