<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>DX Play - W0</title>
  <!-- Samsung only: AVPlay + productinfo. The TV injects $WEBAPIS; elsewhere this 404s harmlessly. -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; color: #fff;
      font-family: sans-serif; overflow: hidden; }
    #av { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #000; }
    #panel { position: absolute; left: 40px; top: 40px; width: 900px; padding: 20px 28px;
      background: rgba(0, 0, 0, 0.72); border-radius: 12px; font-size: 24px; line-height: 1.45; }
    #panel h1 { font-size: 32px; margin: 0 0 12px; }
    .ok { color: #4ade80; } .bad { color: #f87171; } .wait { color: #fbbf24; }
    #keys { margin-top: 12px; font-size: 20px; color: #cbd5e1; }
    #help { margin-top: 12px; font-size: 20px; color: #94a3b8; }
  </style>
</head>
<body>
  <object id="av" type="application/avwindow" style="display:none"></object>
  <video id="video" style="display:none" playsinline></video>
  <div id="panel">
    <h1>DX Play · W0 proof</h1>
    <div id="rows"></div>
    <div id="player"></div>
    <div id="keys"></div>
    <div id="help">1 = TV player · 2 = mpegts.js · ▲▼ or 6/4 = channel · 0 = stop · 9 = hide/show</div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
