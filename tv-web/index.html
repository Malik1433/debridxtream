<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>DX Play</title>
  <!-- Samsung only: AVPlay + productinfo. The TV injects $WEBAPIS; elsewhere this 404s harmlessly. -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <!-- Samsung AVPlay draws on this plane, under the page. -->
  <object id="av-plane" type="application/avwindow" style="display:none;position:absolute;left:0;top:0;width:1920px;height:1080px"></object>
  <div id="root"></div>
  <script type="module" src="./src/app/main.tsx"></script>
</body>
</html>
